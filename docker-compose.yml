version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: student-record-db
    environment:
      POSTGRES_DB: student_records
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
